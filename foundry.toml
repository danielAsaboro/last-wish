[profile.default]
src = "contracts"
test = "contracts/test"
script = "script"
out = "contracts/out"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
